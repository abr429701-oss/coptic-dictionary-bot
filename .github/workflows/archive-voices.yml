name: Archive recordings

# Collects the recordings that the bot posts in the private archive group and stores them with rclone
# (Google Drive, Dropbox, Backblaze B2, R2 ...). Telegram keeps updates for 24 hours, so keep the schedule.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-voices
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARCHIVE_BOT_TOKEN: ${{ secrets.ARCHIVE_BOT_TOKEN }}
      ARCHIVE_CHAT_ID: ${{ secrets.ARCHIVE_CHAT_ID }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      RCLONE_DEST: ${{ secrets.RCLONE_DEST }}
    steps:
      - name: Check the settings
        id: cfg
        run: |
          if [ -z "$ARCHIVE_BOT_TOKEN" ] || [ -z "$ARCHIVE_CHAT_ID" ]; then
            echo "ARCHIVE_BOT_TOKEN / ARCHIVE_CHAT_ID are not set yet; nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Download new recordings
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/archive_voices.mjs fetch archive-out

      - name: Install FFmpeg
        if: steps.cfg.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Process recordings against the reference profile
        if: steps.cfg.outputs.ok == 'true'
        run: |
          mkdir -p audio-transformed
          for input in archive-out/*.ogg; do
            [ -e "$input" ] || continue
            id="$(basename "$input" .ogg)"
            node scripts/process_voice.mjs "$input" "audio-transformed/$id.ogg"
          done

      - name: Upload with rclone
        id: upload
        if: steps.cfg.outputs.ok == 'true'
        run: |
          if ! ls archive-out/*.ogg >/dev/null 2>&1; then echo "No new recordings."; echo "stored=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$RCLONE_CONFIG_B64" ] || [ -z "$RCLONE_DEST" ]; then
            echo "RCLONE_CONFIG_B64 / RCLONE_DEST not set: keeping the files as a workflow artifact instead."
            echo "stored=artifact" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsSL https://rclone.org/install.sh | sudo bash
          printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > rclone.conf
          rclone copy archive-out "$RCLONE_DEST" --config rclone.conf --include "*.ogg"
          rclone copy audio-transformed "$RCLONE_DEST/transformed" --config rclone.conf --include "*.ogg"
          rm -f rclone.conf
          echo "stored=rclone" >> "$GITHUB_OUTPUT"

      - name: Publish transformed audio branch
        if: steps.cfg.outputs.ok == 'true'
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" audio-transformed >/dev/null 2>&1; then
            git clone -q --depth 1 --branch audio-transformed "$REMOTE" transformed-publish
            rm -rf transformed-publish/.git
          else
            mkdir -p transformed-publish
          fi
          cp audio-transformed/*.ogg transformed-publish/ 2>/dev/null || true
          cd transformed-publish
          git init -q
          git checkout -q -b audio-transformed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Process recorded voices to reference profile"
          git push -q -f "$REMOTE" audio-transformed

      - name: Keep the files as an artifact (when rclone is not configured)
        if: steps.upload.outputs.stored == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: recordings
          path: archive-out/*.ogg
          retention-days: 90

      - name: Confirm to Telegram
        if: steps.cfg.outputs.ok == 'true'
        run: node scripts/archive_voices.mjs ack archive-out
