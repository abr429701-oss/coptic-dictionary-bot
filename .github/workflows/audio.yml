name: Build word audio (IPA Reader Miguel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/dictionary.json
      - src/neural-voice.js
      - scripts/gen_audio.mjs
      - scripts/gen_audio_ipa_reader.mjs
      - package.json
      - package-lock.json
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      AUDIO_SYNC_SECRET: ${{ secrets.AUDIO_SYNC_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and Chromium dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Get the existing audio branch (for incremental builds)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" audio >/dev/null 2>&1; then
            git clone -q --depth 1 --branch audio "$REMOTE" audio-out
          else
            mkdir audio-out
          fi

      - name: Generate missing or changed words from IPA Reader
        env:
          IPA_VOICE: Miguel
          IPA_SLOW_FACTOR: "0.75"
          IPA_REPEATS: "3"
          IPA_BREAK_MS: "700"
          IPA_WORKERS: "1"
        run: node scripts/gen_audio_ipa_reader.mjs audio-out 1500

      - name: Publish the audio filename index to main
        run: |
          git pull --rebase origin main
          cp audio-out/audio-index.json data/audio-manifest.json
          if git diff --quiet -- data/audio-manifest.json; then
            echo "Audio filename index unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/audio-manifest.json
            git commit -m "Update generated audio filename index"
            git push
          fi

      - name: Publish to the audio branch (single commit, no history growth)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd audio-out
          rm -rf .git
          git init -q
          git checkout -q -b audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rebuild word audio"
          git push -q -f "$REMOTE" audio

      - name: Update effective audio links in dictionary!L
        if: ${{ !cancelled() }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          AUDIO_SYNC_SECRET: ${{ secrets.AUDIO_SYNC_SECRET }}
          AUDIO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/audio
        run: |
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$AUDIO_SYNC_SECRET" ]; then
            echo "::error::APPS_SCRIPT_URL or AUDIO_SYNC_SECRET is missing"; exit 1
          fi
          node scripts/sync_audio_sheet.mjs data/audio-manifest.json
