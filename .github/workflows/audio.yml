name: Build word audio (IPA Reader Miguel)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/dictionary.json
      - src/neural-voice.js
      - scripts/gen_audio.mjs
      - scripts/gen_audio_ipa_reader.mjs
      - package.json
      - package-lock.json
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      AUDIO_SYNC_SECRET: ${{ secrets.AUDIO_SYNC_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg and Chromium dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Get the existing audio branch (for incremental builds)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" audio >/dev/null 2>&1; then
            git clone -q --depth 1 --branch audio "$REMOTE" audio-out
          else
            mkdir audio-out
          fi

      - name: Generate, publish and sync to the sheet in batches
        id: gen
        env:
          IPA_VOICE: Miguel
          IPA_SLOW_FACTOR: "0.75"
          IPA_REPEATS: "1"
          IPA_BREAK_MS: "700"
          IPA_WORKERS: "1"
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          AUDIO_SYNC_SECRET: ${{ secrets.AUDIO_SYNC_SECRET }}
          AUDIO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/audio
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          BATCH: "50"
          BUDGET_MIN: "150"
        run: |
          set -eo pipefail
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$AUDIO_SYNC_SECRET" ]; then
            echo "::error::APPS_SCRIPT_URL or AUDIO_SYNC_SECRET is missing"; exit 1
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -d audio-out/.git ]; then
            git -C audio-out init -q -b audio
            git -C audio-out remote add origin "$REMOTE"
          fi
          FINISHED=0
          END=$(( $(date +%s) + BUDGET_MIN * 60 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            FATAL=0
            node scripts/gen_audio_ipa_reader.mjs audio-out "$BATCH" 2>&1 | tee gen.log || FATAL=1
            TOTAL=$(grep -oE '^[0-9]+ pending \(of [0-9]+\)' gen.log | head -1 | sed -E 's/.*\(of ([0-9]+)\)/\1/' || true)
            TOTAL=${TOTAL:-0}
            if [ -n "$(git -C audio-out status --porcelain)" ]; then
              git -C audio-out add -A
              git -C audio-out commit -q -m "Add word audio batch"
              git -C audio-out push -q "$REMOTE" HEAD:refs/heads/audio
            fi
            node scripts/sync_audio_sheet.mjs audio-out/audio-index.json
            if [ "$FATAL" = "1" ]; then echo "::error::generator stopped on a fatal error"; exit 1; fi
            if [ "$TOTAL" -le "$BATCH" ]; then echo "All words are done."; FINISHED=1; break; fi
          done
          if [ "$FINISHED" = "1" ]; then echo "more=false" >> "$GITHUB_OUTPUT"; else echo "more=true" >> "$GITHUB_OUTPUT"; fi

      - name: Publish the audio filename index and versions to main
        id: index
        run: |
          git pull --rebase origin main
          cp audio-out/audio-index.json data/audio-manifest.json
          # id -> hash of the voice it was built from: the bot uses it to drop its cached copy when a word's voice changes
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('audio-out/manifest.json','utf8'));const i=JSON.parse(fs.readFileSync('audio-out/audio-index.json','utf8'));const o={};for(const k of Object.keys(i)){const e=m[k];if(e&&typeof e==='object'&&e.hash)o[k]=e.hash}fs.writeFileSync('data/audio-versions.json',JSON.stringify(o))"
          git add data/audio-manifest.json data/audio-versions.json
          if git diff --cached --quiet; then
            echo "Audio index unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update generated audio filename index"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the audio branch (single commit, no history growth)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd audio-out
          rm -rf .git
          git init -q
          git checkout -q -b audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rebuild word audio"
          git push -q -f "$REMOTE" audio

      - name: Update effective audio links in dictionary!L
        if: ${{ !cancelled() }}
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          AUDIO_SYNC_SECRET: ${{ secrets.AUDIO_SYNC_SECRET }}
          AUDIO_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/audio
        run: |
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$AUDIO_SYNC_SECRET" ]; then
            echo "::error::APPS_SCRIPT_URL or AUDIO_SYNC_SECRET is missing"; exit 1
          fi
          node scripts/sync_audio_sheet.mjs data/audio-manifest.json

      - name: Continue with the remaining words
        if: ${{ !cancelled() && steps.gen.outputs.more == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run audio.yml --ref main

      - name: Deploy the bot with the new audio index (a push made here cannot start the deploy by itself)
        if: ${{ !cancelled() && steps.index.outputs.changed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -f setup_webhook=false
