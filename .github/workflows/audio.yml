name: Build word audio (espeak-ng)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/dictionary.json
      - src/neural-voice.js
      - scripts/gen_audio.mjs
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install espeak-ng and ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg

      - name: Get the existing audio branch (for incremental builds)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REMOTE" audio >/dev/null 2>&1; then
            git clone -q --depth 1 --branch audio "$REMOTE" audio-out
          else
            mkdir audio-out
          fi

      - name: Generate missing or changed words
        run: node scripts/gen_audio.mjs audio-out

      - name: Publish to the audio branch (single commit, no history growth)
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          cd audio-out
          rm -rf .git
          git init -q
          git checkout -q -b audio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Rebuild word audio"
          git push -q -f "$REMOTE" audio
