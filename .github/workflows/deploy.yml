name: Deploy Coptic Dictionary Bot

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      setup_webhook:
        description: "Re-create secrets and Telegram webhook (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  sync:
    # Every push to main is deployed automatically; schedules also keep the dictionary fresh.
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build dictionary.json from the Google Sheet
        run: python3 scripts/sheet_to_json.py

      - name: Set up Node.js (for the word cards)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Draw word cards (a failure here never blocks the dictionary sync)
        continue-on-error: true
        run: |
          npm ci
          node scripts/render_cards.mjs

      - name: Commit data and cards if they changed
        id: commit
        run: |
          git add -A data cards
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync dictionary and word cards from Google Sheet"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to deploy
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.commit.outputs.changed }}" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Sheet unchanged; nothing to deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: sync
    if: ${{ needs.sync.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      SETUP_WEBHOOK: ${{ github.event_name == 'workflow_dispatch' && inputs.setup_webhook != 'false' }}
    steps:
      - name: Check out repository (latest main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate required secrets and variables
        run: |
          keys="CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID"
          if [ "$SETUP_WEBHOOK" = "true" ]; then keys="$keys TELEGRAM_BOT_TOKEN"; fi
          for key in $keys; do
            if [ -z "${!key}" ]; then echo "Missing GitHub secret/variable: $key"; exit 1; fi
          done
          if [ -n "$APPS_SCRIPT_URL" ] && ! printf '%s' "$APPS_SCRIPT_URL" | grep -Eq '^https://script\.google\.com/(a/[^/[:space:]]+/)?macros/s/[A-Za-z0-9_-]+/exec$'; then
            echo "Invalid APPS_SCRIPT_URL: use the Apps Script web app URL ending in /exec."; exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Deploy Worker and detect its URL
        run: |
          set -o pipefail
          if ! npx wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log; then
            echo "::error title=wrangler deploy failed::$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/wrangler-deploy.log | tail -30 | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
          clean_log="$(sed 's/\x1b\[[0-9;]*[A-Za-z]//g' /tmp/wrangler-deploy.log)"
          worker_url="$(printf '%s' "$clean_log" | grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' | tail -n 1 || true)"
          if [ -z "$worker_url" ]; then
            worker_url="https://coptic-dictionary-bot.abr429701.workers.dev"
            echo "Could not detect URL from wrangler output; using fallback $worker_url"
          fi
          echo "WORKER_URL=$worker_url" >> "$GITHUB_ENV"

      - name: Generate a random webhook secret
        if: ${{ env.SETUP_WEBHOOK == 'true' }}
        run: |
          webhook_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$webhook_secret"
          echo "WEBHOOK_SECRET=$webhook_secret" >> "$GITHUB_ENV"

      - name: Store Telegram secrets on the Worker
        if: ${{ env.SETUP_WEBHOOK == 'true' }}
        run: |
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --name coptic-dictionary-bot
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET --name coptic-dictionary-bot

      - name: Store the Apps Script link on the Worker
        if: ${{ env.APPS_SCRIPT_URL != '' }}
        run: |
          printf '%s' "$APPS_SCRIPT_URL" | npx wrangler secret put APPS_SCRIPT_URL --name coptic-dictionary-bot

      - name: Register Telegram webhook
        if: ${{ env.SETUP_WEBHOOK == 'true' }}
        run: |
          set -euo pipefail
          response="$(curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WORKER_URL}/webhook" \
            --data-urlencode "secret_token=${WEBHOOK_SECRET}" \
            --data-urlencode 'allowed_updates=["message","callback_query","inline_query"]' \
            --data-urlencode 'drop_pending_updates=true')"
          echo "$response"
          node -e 'const r=JSON.parse(process.argv[1]); if (!r.ok) process.exit(1)' "$response"

      - name: Show webhook status
        if: ${{ env.SETUP_WEBHOOK == 'true' }}
        run: |
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).result||{};console.log({url:r.url,pending:r.pending_update_count,last_error:r.last_error_message||null})})'
