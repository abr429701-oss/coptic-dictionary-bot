<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعلم اللغة القبطية</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --ink: #101d1a;
    --muted: #5d6f69;
    --paper: #f7f5ef;
    --card: #ffffff;
    --line: #e3dcc9;
    --teal: #0c5a52;
    --teal-deep: #082e2a;
    --teal-soft: #dfedea;
    --gold: #a8852a;
    --gold-bright: #e6c65c;
    --gold-soft: #f6ecd0;
    --danger: #b3261e;
    --danger-soft: #fbeae8;
    --ok: #1e7a4c;
    --ok-soft: #e3f2e9;
    --radius: 20px;
    --shadow: 0 2px 6px rgba(16, 29, 26, .07), 0 14px 34px rgba(16, 29, 26, .08);
    --shadow-lg: 0 4px 12px rgba(16, 29, 26, .10), 0 22px 48px rgba(16, 29, 26, .14);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif;
    background: var(--paper); color: var(--ink); line-height: 1.8;
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }

  /* ---- top bar ---- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: calc(12px + env(safe-area-inset-top)) 18px 12px;
    background: var(--teal-deep); color: #fff;
    border-bottom: 2px solid var(--gold);
  }
  #backBtn {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .4); background: transparent; color: #fff;
    font-size: 24px; line-height: 1; cursor: pointer; padding: 0 0 3px;
  }
  #title { flex: 1; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbarSpacer { flex: 0 0 38px; }

  main { max-width: 680px; margin: 0 auto; padding: 0 18px calc(32px + env(safe-area-inset-bottom)); }

  /* ---- home hero ---- */
  .hero {
    margin: 20px 0 8px; padding: 30px 24px 24px; border-radius: 26px;
    background: linear-gradient(150deg, #0a3d38, var(--teal) 55%, #12837a);
    color: #fff; box-shadow: var(--shadow-lg);
    border: 1px solid rgba(230, 198, 92, .55);
    outline: 1px solid rgba(230, 198, 92, .25); outline-offset: 5px;
  }
  .heroMark { font-size: 34px; font-weight: 700; color: var(--gold-bright); line-height: 1.1; letter-spacing: .04em; }
  .hero h1 { margin: 8px 0 4px; font-size: 30px; line-height: 1.35; }
  .hero p { margin: 0; font-size: 14px; line-height: 1.9; color: #d5e9e6; }
  .heroStats { display: flex; margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, .22); }
  .heroStats > div { flex: 1; text-align: center; }
  .heroStats > div + div { border-inline-start: 1px solid rgba(255, 255, 255, .22); }
  .heroStats b { display: block; font-size: 22px; line-height: 1.2; }
  .heroStats span { font-size: 12px; color: #cfe4e1; }

  /* ---- level sections + lesson cards ---- */
  .levelHead { margin: 30px 2px 14px; }
  .levelHead h2 { margin: 0; font-size: 20px; }
  .levelHead h2::after { content: ""; display: block; width: 34px; height: 3px; background: var(--gold); border-radius: 2px; margin-top: 6px; }
  .levelHead .countPill {
    display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 700; color: var(--teal);
    background: var(--teal-soft); border-radius: 999px; padding: 3px 12px;
  }
  .lessonCard {
    display: flex; align-items: stretch; gap: 0; width: 100%; text-align: right; overflow: hidden;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 0; margin: 0 0 12px; cursor: pointer; box-shadow: var(--shadow);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .lessonCard:active { transform: scale(.985); box-shadow: var(--shadow-lg); }
  .lessonThumb {
    flex: 0 0 72px; display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800; color: #fff;
    background: linear-gradient(160deg, var(--teal), #12837a);
  }
  .lessonCard.lvl2 .lessonThumb { background: linear-gradient(160deg, #8a6d1f, var(--gold)); }
  .lessonBody { flex: 1; min-width: 0; padding: 15px 16px; }
  .lessonTitle { display: block; font-size: 16px; font-weight: 700; line-height: 1.6; }
  .lessonChips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .chip {
    font-size: 11px; font-weight: 600; color: var(--muted);
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px;
  }
  .lessonArrow { flex: 0 0 auto; align-self: center; font-size: 26px; color: #c3c8b6; line-height: 1; padding-inline-end: 14px; }

  /* ---- level cards on the home screen (2026-11-13): both levels sit on
     the home screen as two big cards, so the student taps a level instead
     of scrolling past all 17 level-1 lessons to reach level 2 ---- */
  .levelCard {
    display: flex; align-items: stretch; gap: 0; width: 100%; text-align: right; overflow: hidden;
    background: linear-gradient(150deg, var(--teal-deep), var(--teal));
    border: 1px solid rgba(230, 198, 92, .55);
    border-radius: var(--radius); padding: 0; margin: 0 0 14px; cursor: pointer;
    box-shadow: var(--shadow-lg); color: #fff;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .levelCard:active { transform: scale(.985); box-shadow: var(--shadow-lg); }
  .levelCard.lvl2 { background: linear-gradient(150deg, #6b5316, #a5822a); }
  .levelCardNum {
    flex: 0 0 72px; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; color: var(--gold-bright);
    border-inline-end: 1px solid rgba(255, 255, 255, .22);
  }
  .levelCardBody { flex: 1; min-width: 0; padding: 18px 16px; }
  .levelCardTitle { display: block; font-size: 19px; font-weight: 800; line-height: 1.5; }
  .levelCardSub { display: block; font-size: 13px; color: #d5e9e6; margin-top: 4px; }
  .levelCardArrow { flex: 0 0 auto; align-self: center; font-size: 26px; color: var(--gold-bright); line-height: 1; padding-inline-end: 14px; }

  /* ---- lesson view ---- */
  .lessonHead { margin: 24px 2px 18px; }
  .levelTag {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--gold);
    background: var(--gold-soft); border-radius: 999px; padding: 3px 12px; margin-bottom: 10px;
  }
  .lessonHead h2 { margin: 0; font-size: 25px; line-height: 1.5; }
  .item { margin: 20px 0; }
  .lbl { font-size: 12px; font-weight: 800; color: var(--gold); margin-bottom: 10px; letter-spacing: .02em; }
  .videoWrap {
    position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000;
    border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow-lg);
    border: 1px solid #d8c98f;
  }
  .videoWrap video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }
  .photo { width: 100%; border-radius: var(--radius); display: block; box-shadow: var(--shadow); }
  .exercise {
    background: var(--card); border-inline-start: 4px solid var(--gold);
    border-radius: var(--radius); padding: 18px 20px; font-size: 15px; box-shadow: var(--shadow);
  }
  .fallback { display: inline-block; color: var(--teal); font-size: 13px; margin-top: 10px; }
  .muted { color: var(--muted); font-size: 13px; }

  /* ---- exam CTA in a lesson ---- */
  .examCta {
    background: linear-gradient(150deg, var(--teal-deep), var(--teal));
    border: 1px solid rgba(230, 198, 92, .5);
    border-radius: 22px; padding: 22px; color: #fff; box-shadow: var(--shadow-lg);
  }
  .examCtaTitle { font-size: 18px; font-weight: 700; }
  .examCta .muted { color: #cfe4e1; }
  .lockChip {
    display: inline-block; font-size: 12px; font-weight: 700; color: var(--gold-bright);
    background: rgba(230, 198, 92, .14); border: 1px solid rgba(230, 198, 92, .4);
    border-radius: 999px; padding: 3px 12px; margin-bottom: 10px;
  }
  .examCta .examBtn { margin-top: 16px; background: linear-gradient(135deg, #f4d97a, var(--gold-bright)); color: var(--teal-deep); }

  .examBtn {
    display: block; text-align: center; text-decoration: none; font-size: 16px; font-weight: 800;
    background: linear-gradient(135deg, var(--teal), #12837a); color: #fff;
    border-radius: 14px; padding: 15px; margin: 8px 0; border: 0; width: 100%; cursor: pointer;
    box-shadow: 0 6px 18px rgba(12, 90, 82, .30);
    transition: transform .15s ease, opacity .15s ease;
  }
  .examBtn:active { transform: scale(.98); }
  .examBtn:disabled { opacity: .45; box-shadow: none; }

  .getCodeBtn {
    display: block; width: 100%; text-align: center; font-size: 15px; font-weight: 700;
    background: var(--card); color: var(--teal); border: 1.5px solid var(--teal);
    border-radius: 14px; padding: 13px; margin: 16px 0 0; cursor: pointer;
    box-shadow: var(--shadow); transition: transform .15s ease;
  }
  .getCodeBtn:active { transform: scale(.98); }
  .fsBtn {
    display: block; width: 100%; margin-top: 10px; padding: 11px; font-size: 15px; font-weight: 700;
    background: var(--teal-soft); color: var(--teal); border: 1.5px solid var(--teal);
    border-radius: 12px; cursor: pointer;
  }
  .fsBtn:active { transform: scale(.98); }
  /* Cinema mode — the definitive fullscreen (2026-11-13). The browser
     fullscreen API does not work inside Telegram's webview at all, so
     fullscreen here is a fixed overlay that fills the whole webview:
     pure DOM and CSS, no gesture and no browser permission can block it.
     The overlay stops short of the bottom of the screen (48px + the
     safe-area inset): without the gap the video and its controls sit on
     top of the phone's bottom buttons and the user cannot reach them
     (back / home / gestures) while the video is open. */
  .cinema {
    position: fixed; inset: 0 0 calc(env(safe-area-inset-bottom, 0px) + 48px) 0; z-index: 1000; background: #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .cinema video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .cinemaClose {
    position: absolute; top: 14px; inset-inline-end: 14px; z-index: 1001;
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255, 255, 255, .18); color: #fff; font-size: 22px; font-weight: 700;
  }
  .cinemaHint {
    position: absolute; bottom: 18px; left: 0; right: 0; z-index: 1001;
    text-align: center; color: rgba(255, 255, 255, .75); font-size: 13px; pointer-events: none;
  }
  .linkBtn {
    display: block; margin: 14px auto 0; padding: 0; border: 0; background: none;
    color: var(--teal); font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: underline;
  }

  /* ---- get-code screen ---- */
  .fieldLabel { display: block; text-align: right; font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }
  .codeBig {
    font-size: 30px; font-weight: 800; letter-spacing: 3px; text-align: center;
    background: var(--teal-soft); border: 1.5px dashed var(--teal); border-radius: 14px;
    padding: 12px; margin: 16px 0 6px; user-select: all;
  }

  /* ---- exam code gate + greeting ---- */
  .gateCard {
    background: var(--card); border: 1px solid var(--line); border-radius: 24px;
    padding: 32px 22px; margin: 24px 0; box-shadow: var(--shadow-lg); text-align: center;
  }
  .gateIcon {
    width: 74px; height: 74px; margin: 0 auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; background: var(--gold-soft);
  }
  .gateCard h2 { margin: 16px 0 4px; font-size: 22px; }
  .gateCard .qText { text-align: center; font-size: 19px; letter-spacing: 2px; margin-top: 18px; }
  .gateCard .qErr { text-align: right; }
  .gateCard .examBtn { margin-top: 18px; }
  .gateName { color: var(--gold); }
  .loader { display: flex; justify-content: center; gap: 7px; margin: 20px 0 4px; }
  .loader span { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); animation: pulse 1.1s infinite ease-in-out; }
  .loader span:nth-child(2) { animation-delay: .18s; }
  .loader span:nth-child(3) { animation-delay: .36s; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }

  /* ---- exam screen ---- */
  .examHead {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 20px; margin: 20px 0 6px; box-shadow: var(--shadow);
  }
  .examHeadTitle { font-size: 20px; font-weight: 700; line-height: 1.6; }
  .examHeadLabel { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .progress { height: 8px; background: var(--teal-soft); border-radius: 999px; overflow: hidden; margin: 16px 0 6px; }
  .progressBar { height: 100%; width: 0; background: linear-gradient(90deg, var(--teal), var(--gold-bright)); border-radius: 999px; transition: width .3s ease; }
  .qCard {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin: 14px 0; box-shadow: var(--shadow);
  }
  .qTop { display: flex; align-items: flex-start; gap: 11px; }
  .qNum {
    flex: 0 0 auto; width: 31px; height: 31px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: var(--gold); background: var(--gold-soft);
  }
  .qTitle { flex: 1; font-size: 15px; font-weight: 600; line-height: 1.8; }
  .qTitle .req { color: var(--danger); }
  .qImg { width: 100%; border-radius: 14px; display: block; margin: 12px 0 4px; }
  .qText, .qSelect {
    width: 100%; font-size: 15px; padding: 12px 14px;
    border: 1.5px solid var(--line); border-radius: 12px; outline: none;
    background: var(--card); color: var(--ink);
    transition: border-color .15s ease, background .15s ease;
  }
  .qText:focus, .qSelect:focus { border-color: var(--teal); }
  .qText.invalid, .qSelect.invalid { border-color: var(--danger); background: #fffafa; }
  .qText.valid { border-color: var(--ok); background: #f6fcf8; }
  .opt {
    display: flex; align-items: center; gap: 11px; padding: 12px 14px; margin: 8px 0;
    font-size: 15px; cursor: pointer; border: 1.5px solid var(--line); border-radius: 14px;
    background: var(--card); transition: border-color .15s ease, background .15s ease;
  }
  .opt input { accent-color: var(--teal); width: 19px; height: 19px; flex: 0 0 auto; margin: 0; }
  .opt:has(input:checked) { border-color: var(--teal); background: var(--teal-soft); }
  .qErr { color: var(--danger); font-size: 13px; font-weight: 700; margin-top: 8px; display: none; }
  .qSection {
    font-size: 17px; font-weight: 800; margin: 30px 2px 4px; padding-top: 18px;
    border-top: 2px solid var(--line);
  }
  .submitBar { position: sticky; bottom: 0; padding: 12px 0 calc(4px + env(safe-area-inset-bottom)); background: linear-gradient(rgba(247, 245, 239, 0), var(--paper) 32%); }
  .examNote { text-align: center; margin: 4px 0 10px; }

  /* ---- success / error ---- */
  .success { text-align: center; padding: 44px 16px; }
  .checkCircle {
    width: 80px; height: 80px; margin: 0 auto 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; color: #fff; background: var(--ok); box-shadow: var(--shadow-lg);
  }
  .success h2 { margin: 0 0 8px; font-size: 23px; }
  .confirm { white-space: pre-wrap; line-height: 1.9; font-size: 15px; margin: 12px 0 22px; }
  #error {
    background: var(--danger-soft); color: var(--danger); border: 1px solid #f0c9c6;
    padding: 14px 16px; border-radius: 14px; margin: 20px 0; font-size: 14px; font-weight: 700;
  }
</style>
</head>
<body>
<header class="topbar">
  <button id="backBtn" type="button" aria-label="رجوع" style="display:none">‹</button>
  <div id="title">تعلم اللغة القبطية</div>
  <span class="topbarSpacer"></span>
</header>
<main id="view"></main>
<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
  var view = document.getElementById("view");
  var titleEl = document.getElementById("title");
  var backBtn = document.getElementById("backBtn");
  var current = null; // lesson id, "level:0"/"level:1", "exam", "gate", "greeting", or null = home
  var currentLevel = null; // index of the level the open lesson belongs to (for Back)
  var lessons = null;
  var examCache = null;
  var examForm = null;
  var examQuestions = null; // visible questions (the code question is gated out)
  var examLesson = null;
  var examCode = null; // code verified at the gate, submitted as its answer
  var examCodeEntryId = null;
  var codeNamesCache = null;
  var lastGate = null; // {form, codeQ, lessonId} — to return to the gate from get-code
  var getCodeFrom = "home"; // "home" or "gate"

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function arabicNum(n) {
    return String(n).replace(/\d/g, function (d) { return "٠١٢٣٤٥٦٧٨٩"[Number(d)]; });
  }
  // Lesson videos and photos play/show through the Worker's /media/<id>
  // proxy: it forwards the Range header to Drive and streams the file back
  // with clean media headers (no redirect, no attachment disposition), so
  // the native <video> plays inline and <img> renders — the direct Drive
  // links fail on the user's phone webview (attachment disposition).
  // Cost, user-approved ("بطلب صغير"): one Worker request per Range fetch
  // for video, one per photo/image load.
  function driveImg(id) { return "/media/" + encodeURIComponent(id); }
  function driveVideo(id) { return "/media/" + encodeURIComponent(id); }

  // The get-code form (final registration project) — fallback when the
  // in-app code lookup cannot reach the macro.
  var GET_CODE_FORM_URL = "https://script.google.com/macros/s/AKfycbz68tq_KXu_1ZV0pB1s0NidWhnTli3zG0k_8rjFQWhp/exec";

  function formIdFromUrl(url) {
    var m = String(url || "").match(/\/forms\/d\/([A-Za-z0-9_-]+)\//);
    return m ? m[1] : null;
  }

  function loadLessons() {
    if (lessons) return Promise.resolve(lessons);
    return fetch("lessons.json")
      .then(function (r) { if (!r.ok) throw new Error("lessons.json: " + r.status); return r.json(); })
      .then(function (json) { lessons = json; return json; });
  }

  function loadExams() {
    if (examCache) return Promise.resolve(examCache);
    return fetch("exams.json")
      .then(function (r) { if (!r.ok) throw new Error("exams.json: " + r.status); return r.json(); })
      .then(function (json) { examCache = json; return json; });
  }

  // Code -> student-name map, built at publish time from the "تجميع الرقم
  // الكودي" sheet. Loaded lazily at the gate; a failure just means the
  // greeting falls back to a generic one — the gate itself never blocks.
  function loadCodeNames() {
    if (codeNamesCache) return Promise.resolve(codeNamesCache);
    return fetch("codes.json")
      .then(function (r) { if (!r.ok) throw new Error("codes.json: " + r.status); return r.json(); })
      .then(function (json) { codeNamesCache = json.names || {}; return codeNamesCache; })
      .catch(function () { codeNamesCache = {}; return codeNamesCache; });
  }

  function lessonChips(lesson) {
    var kinds = lesson.items.map(function (i) { return i.kind; });
    var chips = [];
    if (kinds.indexOf("video") !== -1) chips.push("🎬 فيديو");
    if (kinds.indexOf("photo") !== -1) chips.push("🖼 صور");
    if (kinds.indexOf("text") !== -1) chips.push("📝 تدريب");
    if (kinds.indexOf("url") !== -1) chips.push("📝 امتحان");
    return chips.map(function (c) { return "<span class='chip'>" + c + "</span>"; }).join("");
  }

  function showHome() {
    current = null;
    currentLevel = null;
    examLesson = null;
    examCode = null;
    examCodeEntryId = null;
    examQuestions = null;
    titleEl.textContent = "تعلم اللغة القبطية";
    backBtn.style.display = "none";
    if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch (e) {} }
    loadLessons().then(function (data) {
      var totalLessons = 0, totalExams = 0;
      data.levels.forEach(function (level) {
        totalLessons += level.lessons.length;
        level.lessons.forEach(function (lesson) {
          if (lesson.items.some(function (i) { return i.kind === "url"; })) totalExams++;
        });
      });
      var html = "<div class='hero'><div class='heroMark'>Ⲭⲏⲙⲓ</div>" +
        "<h1>تعلم اللغة القبطية</h1>" +
        "<p>دروس فيديو وصور وتمارين وامتحانات — كل الدروس مفتوحة، وابدأ من أي مكان.</p>" +
        "<div class='heroStats'>" +
        "<div><b>" + totalLessons + "</b><span>درس</span></div>" +
        "<div><b>" + totalExams + "</b><span>امتحان</span></div>" +
        "<div><b>" + data.levels.length + "</b><span>مستويات</span></div>" +
        "</div></div>" +
        "<button class='getCodeBtn' type='button' id='homeGetCode'>🔑 الحصول على الرقم الكودي</button>" +
        "<button class='getCodeBtn' type='button' id='homeCert'>🎓 الحصول على الشهادة</button>";
      data.levels.forEach(function (level, li) {
        var exams = 0;
        level.lessons.forEach(function (lesson) {
          if (lesson.items.some(function (i) { return i.kind === "url"; })) exams++;
        });
        html += "<button class='levelCard lvl" + (li + 1) + "' type='button' data-level='" + li + "'>" +
          "<span class='levelCardNum'>" + arabicNum(li + 1) + "</span>" +

  // Cinema mode — the definitive fullscreen (2026-11-13). The browser
  // fullscreen API does not work inside Telegram's webview at all: its
  // inline playback is forced on, and fullscreen requests are rejected
  // even from a real tap. So fullscreen is a fixed overlay that fills
  // the whole webview — pure DOM and CSS, no gesture and no browser
  // permission can block it. The video node itself is moved into the
  // overlay (playback keeps its position) and moved back to its place
  // when the overlay closes. Telegram's own fullscreen (the web app
  // taking the whole screen) is requested too when the API exists.
  var cinemaVideo = null;
  var cinemaHome = null; // {parent, next} — where the video goes back to
  function openCinema(v) {
    if (!v || cinemaVideo === v) return;
    closeCinema(true); // close any other video's overlay first
    cinemaVideo = v;
    cinemaHome = { parent: v.parentNode, next: v.nextSibling };
    var overlay = document.createElement("div");
    overlay.className = "cinema";
    overlay.id = "cinemaOverlay";
    var close = document.createElement("button");
    close.className = "cinemaClose";
    close.type = "button";
    close.textContent = "✕";
    close.addEventListener("click", function () { closeCinema(); });
    overlay.appendChild(close);
    overlay.appendChild(v);
    var hint = document.createElement("div");
    hint.className = "cinemaHint";
    hint.textContent = "للرجوع للدرس اضغط ✕ — ولفّ التليفون لو عايز الفيديو بالعرض";
    overlay.appendChild(hint);
    document.body.appendChild(overlay);
    if (tg && tg.requestFullscreen) { try { tg.requestFullscreen(); } catch (e) {} }
    try { var p = v.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
  }
  function closeCinema(silent) {
    var overlay = document.getElementById("cinemaOverlay");
    if (!overlay || !cinemaVideo) return;
    var v = cinemaVideo;
    if (cinemaHome && cinemaHome.parent) cinemaHome.parent.insertBefore(v, cinemaHome.next);
    overlay.remove();
    cinemaVideo = null;
    cinemaHome = null;
    if (!silent && tg && tg.exitFullscreen) { try { tg.exitFullscreen(); } catch (e) {} }
  }

  function showLesson(id) {
    var found = findLesson(id);

    var lesson = found.lesson;
    current = id;
    currentLevel = found.levelIndex;
    examLesson = null;
    examCode = null;
    examCodeEntryId = null;
    examQuestions = null;
    titleEl.textContent = lesson.title;

    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }

      "<h2>" + esc(lesson.title) + "</h2></div>" +

    view.querySelectorAll("[data-exam]").forEach(function (btn) {
      btn.addEventListener("click", function () { openExam(btn.getAttribute("data-exam"), id); });
    });
    view.querySelectorAll("video").forEach(function (v) {
      // The lesson video opens fullscreen automatically: cinema mode is a
      // fixed overlay (pure DOM/CSS), so it needs no gesture and no browser
      // permission — it works in Telegram's webview where the browser
      // fullscreen API is blocked outright.

  function goBack() {
    if (cinemaVideo) { closeCinema(); return; }
    if (current === "cert") { showHome(); return; }
    if (current === "getcode") {
      if (getCodeFrom === "gate" && lastGate) { showCodeGate(lastGate.form, lastGate.codeQ, lastGate.lessonId); return; }
      showHome();
      return;
    }
    if (examLesson) { showLesson(examLesson); return; }
    // Back from a lesson returns to its level list, not to the home
    // screen; back from a level list returns home.
    if (current && String(current).indexOf("level:") === 0) { showHome(); return; }
    if (current) { showLevel(currentLevel); return; }
  }
  backBtn.addEventListener("click", goBack);
  if (tg && tg.BackButton) { try { tg.BackButton.onClick(goBack); } catch (e) {} }

  // The code check, exactly like Google's "matches" validation (full-string
  // match against the alternation of allowed codes). The pattern is huge
  // (~17KB, ~2000 codes) and some phone JS engines refuse to compile a
  // regex that big — so if the regex fails, fall back to a plain set lookup
  // of the same alternatives, and if that cannot be done either, block the
  // submit rather than let an unchecked code through (fail closed, never
  // fail open).
  function codeMatches(pattern, value) {
    try {
      return new RegExp("^(?:" + pattern + ")$").test(value);
    } catch (e) { /* fall through to the set check */ }
    if (pattern.charAt(0) === "(" && pattern.charAt(pattern.length - 1) === ")") {
      var alts = pattern.slice(1, -1).split("|");
      for (var i = 0; i < alts.length; i++) if (alts[i] === value) return true;
      return false;
    }
    return false;
  }

  function renderQuestion(q, num) {
    var img = q.imageId
      ? "<img class='qImg' loading='lazy' src='" + esc(driveImg(q.imageId)) + "' alt=''>"
      : "";
    var req = q.required ? " <span class='req'>*</span>" : "";
    var err = "<div class='qErr' data-err='" + q.entryId + "'></div>";
    if (q.type === 8) {
      return "<h3 class='qSection'>" + esc(q.title) + "</h3>";
    }
    var head = "<div class='qTop'><span class='qNum'>" + num + "</span>" +
      "<div class='qTitle'>" + esc(q.title) + req + "</div></div>" + img;
    if (q.type === 0) {
      var link = q.link
        ? "<a class='fallback' href='" + esc(q.link) + "' target='_blank' rel='noopener'>اضغط هنا لإنشاء رقمك الكودي ←</a>"
        : "";
      return "<div class='qCard' data-q='" + q.entryId + "'>" + head +
        "<input class='qText' type='text' data-entry='" + q.entryId + "' autocomplete='off' inputmode='numeric'>" + link + err + "</div>";
    }
    if (q.type === 2) {
      var opts = (q.options || []).map(function (opt) {
        return "<label class='opt'><input type='radio' name='q_" + q.entryId + "' value='" + esc(opt) + "'><span>" + esc(opt) + "</span></label>";
      }).join("");
      return "<div class='qCard' data-q='" + q.entryId + "'>" + head + opts + err + "</div>";
    }
    if (q.type === 4) {
      // Google renders its dropdowns single-select even when the title says
      // "choose all" — the in-app exam does the same.
      var sel = (q.options || []).map(function (opt) {
        return "<option value='" + esc(opt) + "'>" + esc(opt) + "</option>";
      }).join("");
      return "<div class='qCard' data-q='" + q.entryId + "'>" + head +
        "<select class='qSelect' data-entry='" + q.entryId + "'><option value=''>— اختر —</option>" + sel + "</select>" + err + "</div>";
    }
    return "";
  }

  // "الحصول على الرقم الكودي" inside the app: name + phone, the Worker
  // forwards them to the registration macro and returns the code (the
  // browser cannot read the macro's answer directly — Apps Script sends no
  // CORS headers). From the gate it returns to the gate; from home, home.
  function showGetCode(from) {
    getCodeFrom = from;
    current = "getcode";
    titleEl.textContent = "الحصول على الرقم الكودي";
    backBtn.style.display = "";
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    view.innerHTML = "<div class='gateCard'><div class='gateIcon'>🔑</div>" +
      "<h2>الحصول على الرقم الكودي</h2>" +
      "<p class='muted'>اكتب اسمك الثلاثي ورقم موبايلك، وهنطلعلك الرقم الكودي بتاعك.</p>" +
      "<label class='fieldLabel' for='gcName'>الاسم الثلاثي</label>" +
      "<input class='qText' id='gcName' type='text' autocomplete='name'>" +
      "<label class='fieldLabel' for='gcPhone'>رقم الموبايل</label>" +
      "<input class='qText' id='gcPhone' type='tel' autocomplete='tel' inputmode='tel' dir='ltr' style='text-align:right'>" +
      "<div class='qErr' id='gcErr'></div>" +
      "<button class='examBtn' type='button' id='gcGo'>احصل على الرقم الكودي</button></div>";
    var nameEl = document.getElementById("gcName");
    var phoneEl = document.getElementById("gcPhone");
    var errEl = document.getElementById("gcErr");
    var btn = document.getElementById("gcGo");
    btn.addEventListener("click", function () {
      var name = nameEl.value.trim();
      var phone = phoneEl.value.replace(/\D/g, "");
      if (!name) { errEl.textContent = "اكتب اسمك الثلاثي."; errEl.style.display = "block"; return; }
      if (phone.length < 4) { errEl.textContent = "اكتب رقم موبايل صحيح."; errEl.style.display = "block"; return; }
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "جارٍ إحضار الرقم…";
      fetch("/getcode", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: name, phone: phone }),
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (!data || !data.ok || !data.code) throw new Error("lookup failed");
        view.innerHTML = "<div class='gateCard'><div class='gateIcon'>✓</div>" +
          "<h2>الرقم الكودي الخاص بك</h2>" +
          "<div class='codeBig' id='gcCode'>" + esc(data.code) + "</div>" +
          "<p class='muted'>احفظ الرقم ده — هتحتاجه لدخول كل الامتحانات.</p>" +
          "<button class='examBtn' type='button' id='gcCopy'>نسخ الرقم</button>" +
          "<a class='examBtn' style='background: #25d366; box-shadow: 0 6px 18px rgba(37, 211, 102, .30);' href='" + esc(data.whatsapp || "") + "' target='_blank' rel='noopener'>إرساله على واتساب لتفعيل الاشتراك ←</a>" +
          "<button class='linkBtn' type='button' id='gcBack'>رجوع</button></div>";
        document.getElementById("gcCopy").addEventListener("click", function () {
          var done = function () { this.textContent = "تم النسخ ✓"; }.bind(this);
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(data.code).then(done).catch(function () {});
          } else {
            var tmp = document.createElement("input");
            tmp.value = data.code;
            document.body.appendChild(tmp);
            tmp.select();
            try { document.execCommand("copy"); done(); } catch (e) {}
            document.body.removeChild(tmp);
          }
        });
        document.getElementById("gcBack").addEventListener("click", goBack);
        window.scrollTo(0, 0);
      }).catch(function () {
        btn.disabled = false;
        btn.textContent = "احصل على الرقم الكودي";
        errEl.style.display = "none";
        var err = document.createElement("div");
        err.id = "error";
        err.innerHTML = "تعذّر إحضار الرقم الكودي دلوقتي — جرّب تاني، أو احصل عليه من النموذج مباشرة: " +
          "<a href='" + esc(GET_CODE_FORM_URL) + "' target='_blank' rel='noopener'>فتح نموذج الرقم الكودي ←</a>";
        view.insertBefore(err, view.firstChild);
        window.scrollTo(0, 0);
      });
    });
    window.scrollTo(0, 0);
  }

  // "الحصول على الشهادة" inside the app: pick the level, type the code,
  // the Worker looks it up in the certificate sheets (the same lookup the
  // bot's /cert1 and /cert2 use) and returns the certificate image, or the
  // message (wrong code / missing exams). One Worker request per lookup.
  function showCert() {
    current = "cert";
    titleEl.textContent = "الحصول على الشهادة";
    backBtn.style.display = "";
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    var certLevel = null;
    function render() {
      if (!certLevel) {
        view.innerHTML = "<div class='gateCard'><div class='gateIcon'>🎓</div>" +
          "<h2>الحصول على الشهادة</h2>" +
          "<p class='muted'>اختار المستوى اللي عايز شهادته.</p>" +
          "<button class='examBtn' type='button' data-cert-level='1'>شهادة المستوى الأول</button>" +
          "<button class='examBtn' type='button' data-cert-level='2'>شهادة المستوى الثاني</button></div>";
        view.querySelectorAll("[data-cert-level]").forEach(function (btn) {
          btn.addEventListener("click", function () { certLevel = btn.getAttribute("data-cert-level"); render(); });
        });
        return;
      }
      view.innerHTML = "<div class='gateCard'><div class='gateIcon'>🎓</div>" +
        "<h2>شهادة المستوى " + (certLevel === "1" ? "الأول" : "الثاني") + "</h2>" +
        "<p class='muted'>اكتب الرقم الكودي اللي خدت بيه الشهادة.</p>" +
        "<input class='qText' id='certCode' type='text' autocomplete='off' inputmode='numeric' placeholder='الرقم الكودي'>" +
        "<div class='qErr' id='certErr'></div>" +
        "<button class='examBtn' type='button' id='certGo'>عرض الشهادة</button>" +
        "<button class='linkBtn' type='button' id='certBack'>تغيير المستوى</button></div>";
      var input = document.getElementById("certCode");
      var errEl = document.getElementById("certErr");
      var btn = document.getElementById("certGo");
      document.getElementById("certBack").addEventListener("click", function () { certLevel = null; render(); });
      btn.addEventListener("click", function () {
        var code = input.value.trim();
        if (!/^\d{6,10}$/u.test(code)) { errEl.textContent = "اكتب رقم كودي صحيح."; errEl.style.display = "block"; return; }
        errEl.style.display = "none";
        btn.disabled = true;
        btn.textContent = "جارٍ البحث عن الشهادة…";
        fetch("/cert?code=" + encodeURIComponent(code) + "&level=" + certLevel)
          .then(function (r) {
            var type = r.headers.get("content-type") || "";
            if (type.indexOf("image/") === 0) return r.blob().then(function (b) { return { image: b }; });
            return r.json().then(function (j) { return { json: j }; });
          })
          .then(function (res) {
            if (res.image) {
              var url = URL.createObjectURL(res.image);
              // Downloading from Telegram's webview: the `download`
              // attribute on a blob link does nothing there (the webview
              // has no download handler), so the primary path is the
              // native share sheet — it always offers Save to Files /
              // Save Image — and the direct link to /cert (attachment
              // disposition) is the fallback for browsers that download.
              var certUrl = "/cert?code=" + encodeURIComponent(code) + "&level=" + certLevel;
              view.innerHTML = "<div class='gateCard'><div class='gateIcon'>🎓</div>" +
                "<h2>شهادتك</h2>" +
                "<img class='photo' src='" + url + "' alt='الشهادة'>" +
                "<button class='examBtn' type='button' id='certShare'>📤 مشاركة / حفظ الشهادة</button>" +
                "<a class='examBtn' href='" + certUrl + "' download='certificate.jpg' target='_blank' rel='noopener'>⬇ تحميل الشهادة</a>" +
                "<button class='linkBtn' type='button' id='certDone'>رجوع</button></div>";
              document.getElementById("certShare").addEventListener("click", function () {
                var file = new File([res.image], "certificate.jpg", { type: res.image.type || "image/jpeg" });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                  navigator.share({ files: [file] }).catch(function () {});
                } else {
                  window.open(certUrl, "_blank");
                }
              });
              document.getElementById("certDone").addEventListener("click", goBack);
              window.scrollTo(0, 0);
              return;
            }
            var j = res.json || {};
            var msg = document.createElement("div");
            msg.id = "error";
            msg.textContent = j.text || "الرقم الكودي غير صحيح.";
            view.insertBefore(msg, view.firstChild);
            btn.disabled = false;
            btn.textContent = "عرض الشهادة";
            window.scrollTo(0, 0);
          })
          .catch(function () {
            btn.disabled = false;
            btn.textContent = "عرض الشهادة";
            errEl.textContent = "تعذّر الوصول لشيت النتائج حاليًا. جرّب لاحقًا.";
            errEl.style.display = "block";
          });
      });
      window.scrollTo(0, 0);
    }
    render();
  }

  // The exam does not open until the student types the correct code: the
  // tap on "ابدأ الامتحان" first shows a code gate, and only a matching
  // code lets the exam itself open.
  function openExam(formId, lessonId) {
    loadExams().then(function (json) {
      var form = null;
      (json.forms || []).forEach(function (f) { if (f.formId === formId) form = f; });
      if (!form) throw new Error("exam not found");
      var codeQ = null;
      (form.questions || []).forEach(function (q) {
        if (!codeQ && q.validation && q.validation.kind === "regex") codeQ = q;
      });
      if (codeQ) showCodeGate(form, codeQ, lessonId);
      else showExam(form, lessonId, null, null);
    }).catch(function () {
      view.innerHTML = "<div id='error'>تعذّر تحميل الامتحان — افتحه من جوجل فورم.</div>" +
        "<div class='item'><a class='examBtn' href='https://docs.google.com/forms/d/" + esc(formId) + "/viewform' target='_blank' rel='noopener'>فتح الامتحان في Google Forms ←</a></div>";
    });
  }

  function showCodeGate(form, codeQ, lessonId) {
    examLesson = lessonId;
    examCode = null;
    examCodeEntryId = null;
    examQuestions = null;
    lastGate = { form: form, codeQ: codeQ, lessonId: lessonId };
    current = "gate";
    titleEl.textContent = form.title;
    backBtn.style.display = "";
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    loadCodeNames(); // prefetch so the name is ready when the code is typed
    view.innerHTML = "<div class='gateCard'><div class='gateIcon'>🔐</div>" +
      "<h2>أدخل الرقم الكودي</h2>" +
      "<p class='muted'>لازم تدخل الرقم الكودي الصح عشان الامتحان يتفتح.</p>" +
      "<input class='qText' id='gateCode' type='text' autocomplete='off' inputmode='numeric' placeholder='الرقم الكودي'>" +
      (codeQ.link ? "<a class='fallback' href='" + esc(codeQ.link) + "' target='_blank' rel='noopener'>اضغط هنا لإنشاء رقمك الكودي ←</a>" : "") +
      "<div class='qErr' id='gateErr'></div>" +
      "<button class='examBtn' type='button' id='gateEnter' disabled>دخول الامتحان</button>" +
      "<button class='linkBtn' type='button' id='gateGetCode'>ما عندكش رقم كودي؟ احصل عليه من هنا ←</button></div>";
    var input = document.getElementById("gateCode");
    var errEl = document.getElementById("gateErr");
    var btn = document.getElementById("gateEnter");
    document.getElementById("gateGetCode").addEventListener("click", function () { showGetCode("gate"); });
    // Live check while typing: a wrong code shows the error immediately,
    // a matching code clears it, turns the field green and unlocks entry.
    // The local pattern is baked from the form at build time, so it goes
    // stale when the teacher updates the form's code list — a code the
    // local check rejects gets one live check against THIS form's current
    // pattern (debounced, 7+ digits). The form's own list decides who
    // may enter THIS exam (the teacher's sequencing: exam 2 only opens
    // for codes that finished exam 1) — the registration sheet must not
    // decide eligibility, it holds every student and would let anyone
    // skip ahead. The name for the greeting comes from codes.json, or
    // from the sheet when the name is not baked yet (see enterWithGreeting).
    var gateVerified = null; // {code} once the current value is verified
    var gateTimer = null;
    var gateSeq = 0;
    function gateFail(msg) {
      errEl.textContent = msg || codeQ.validation.errorText || "الرقم الكودي غير صحيح";
      errEl.style.display = "block";
      errEl.style.color = "";
      input.classList.remove("valid");
      input.classList.add("invalid");
      btn.disabled = true;
      gateVerified = null;
    }
    input.addEventListener("input", function () {
      var v = input.value.trim();
      gateSeq++;
      if (gateTimer) { clearTimeout(gateTimer); gateTimer = null; }
      if (!v) {
        errEl.style.display = "none";
        input.classList.remove("invalid", "valid");
        btn.disabled = true;
        gateVerified = null;
        return;
      }
      if (codeMatches(codeQ.validation.pattern, v)) {
        errEl.style.display = "none";
        input.classList.remove("invalid");
        input.classList.add("valid");
        btn.disabled = false;
        gateVerified = { code: v };
        return;
      }
      if (!/^\d{7,}$/u.test(v)) { gateFail(); return; }
      // Looks like a full code but not in the baked list — check it
      // against the form's live pattern.
      errEl.textContent = "جارٍ التحقق من الرقم الكودي…";
      errEl.style.display = "block";
      errEl.style.color = "var(--muted)";
      input.classList.remove("invalid", "valid");
      btn.disabled = true;
      gateVerified = null;
      var seq = gateSeq;
      gateTimer = setTimeout(function () {
        fetch("/exam-pattern?formId=" + encodeURIComponent(form.formId))
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (seq !== gateSeq || input.value.trim() !== v) return; // typed on meanwhile
            if (data && data.ok && codeMatches(data.pattern, v)) {
              errEl.style.display = "none";
              input.classList.remove("invalid");
              input.classList.add("valid");
              btn.disabled = false;
              gateVerified = { code: v };
            } else {
              gateFail();
            }
          })
          .catch(function () {
            if (seq !== gateSeq || input.value.trim() !== v) return;
            gateFail(); // fail closed: an unchecked code never opens the exam
          });
      }, 500);
    });
    btn.addEventListener("click", function () {
      if (gateVerified) enterWithGreeting(form, codeQ, lessonId, gateVerified.code, null);
    });
    window.scrollTo(0, 0);
  }

  // After a correct code, greet the student by the name attached to that
  // code, then head into the exam. The name comes from the baked
  // codes.json; when it is not baked yet (a student who just registered),
  // it is read live from the registration sheet — the name lookup never
  // decides eligibility, only the greeting.
  function enterWithGreeting(form, codeQ, lessonId, code, liveName) {
    var nameP = loadCodeNames().then(function (names) {
      if (liveName) return liveName;
      if (names[code]) return names[code];
      return fetch("/checkcode?code=" + encodeURIComponent(code))
        .then(function (r) { return r.json(); })
        .then(function (d) { return (d && d.ok && d.name) || null; })
        .catch(function () { return null; });
    });
    nameP.then(function (name) {
      current = "greeting";
      titleEl.textContent = form.title;
      view.innerHTML = "<div class='gateCard'><div class='gateIcon'>✓</div>" +
        (name
          ? "<h2>أهلا، <span class='gateName'>" + esc(name) + "</span></h2>"
          : "<h2>أهلا بك</h2>") +
        "<p class='muted'>جاري توجيهك للامتحان…</p>" +
        "<div class='loader'><span></span><span></span><span></span></div>" +
        "<button class='examBtn' type='button' id='gateGo'>دخول الآن ←</button></div>";
      var timer = setTimeout(function () {
        if (current === "greeting") showExam(form, lessonId, code, codeQ.entryId);
      }, 1600);
      document.getElementById("gateGo").addEventListener("click", function () {
        clearTimeout(timer);
        showExam(form, lessonId, code, codeQ.entryId);
      });
      window.scrollTo(0, 0);
    });
  }

  function showExam(form, lessonId, verifiedCode, codeEntryId) {
    examForm = form;
    examLesson = lessonId;
    examCode = verifiedCode || null;
    examCodeEntryId = codeEntryId || null;
    current = "exam";
    titleEl.textContent = form.title;
    backBtn.style.display = "";
    if (tg && tg.BackButton) { try { tg.BackButton.show(); } catch (e) {} }
    // The code question was answered at the gate — it is not shown again
    // inside the exam, but its verified answer is submitted with the rest.
    var visible = (form.questions || []).filter(function (q) {
      return !(q.validation && q.entryId === codeEntryId);
    });
    examQuestions = visible;
    var total = visible.filter(function (q) { return q.entryId !== null; }).length;
    var n = 0;
    var body = visible.map(function (q) {
      if (q.entryId !== null) n++;
      return renderQuestion(q, q.entryId === null ? null : n);
    }).join("");
    view.innerHTML = "<div class='examHead'><div class='examHeadTitle'>" + esc(form.title) + "</div>" +
      (form.label ? "<div class='examHeadLabel'>" + esc(form.label) + "</div>" : "") +
      "<div class='progress'><div class='progressBar' id='examProgressBar'></div></div>" +
      "<div class='muted' id='examProgressText'>أجبت على 0 من " + total + " أسئلة</div></div>" +
      "<form id='examForm' novalidate>" + body +
      "<div class='submitBar'><button class='examBtn' type='submit'>إرسال الإجابات</button></div>" +
      "<div class='muted examNote'>إجابتك هتتبعت لجوجل فورم مباشرة وتتحفظ في نفس شيت النتائج، كأنك فتحت الفورم بالظبط.</div>" +
      "</form>";
    var formEl = document.getElementById("examForm");
    formEl.addEventListener("submit", submitExam);
    formEl.addEventListener("input", updateProgress);
    formEl.addEventListener("change", updateProgress);
    // Live check for any other validated field (the code question itself is
    // gated out, so this binds nothing for it): the error appears the
    // moment a value stops matching, and clears the moment it matches.
    examQuestions.forEach(function (q) {
      if (!q.validation || q.entryId === null) return;
      var input = formEl.querySelector("[data-entry='" + q.entryId + "']");
      var errEl = formEl.querySelector("[data-err='" + q.entryId + "']");
      if (!input || !errEl) return;
      input.addEventListener("input", function () {
        var v = input.value.trim();
        if (!v) {
          errEl.style.display = "none";
          input.classList.remove("invalid", "valid");
          return;
        }
        if (codeMatches(q.validation.pattern, v)) {
          errEl.style.display = "none";
          input.classList.remove("invalid");
          input.classList.add("valid");
        } else {
          errEl.textContent = q.validation.errorText || "إجابة غير صحيحة.";
          errEl.style.display = "block";
          input.classList.remove("valid");
          input.classList.add("invalid");
        }
      });
    });
    updateProgress();
    window.scrollTo(0, 0);
  }

  function updateProgress() {
    var formEl = document.getElementById("examForm");
    if (!formEl || !examQuestions) return;
    var total = 0, done = 0;
    examQuestions.forEach(function (q) {
      if (q.entryId === null) return;
      total++;
      var v = "";
      if (q.type === 0 || q.type === 4) {
        var el = formEl.querySelector("[data-entry='" + q.entryId + "']");
        v = el ? el.value.trim() : "";
      } else if (q.type === 2) {
        v = formEl.querySelector("input[name='q_" + q.entryId + "']:checked") ? "x" : "";
      }
      if (v) done++;
    });
    var bar = document.getElementById("examProgressBar");
    var txt = document.getElementById("examProgressText");
    if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + "%";
    if (txt) txt.textContent = "أجبت على " + done + " من " + total + " أسئلة";
  }

  function submitExam(ev) {
    ev.preventDefault();
    var formEl = document.getElementById("examForm");
    var answers = [];
    // The code verified at the gate is submitted as the code question's
    // answer, so the responses sheet gets exactly the same data as before.
    if (examCodeEntryId !== null && examCode) answers.push({ entryId: examCodeEntryId, value: examCode });
    var firstBad = null;
    function fail(entryId, msg, el) {
      var errEl = formEl.querySelector("[data-err='" + entryId + "']");
      if (errEl) { errEl.textContent = msg; errEl.style.display = "block"; }
      if (el && el.classList) el.classList.add("invalid");
      if (!firstBad) firstBad = el || errEl;
    }
    examQuestions.forEach(function (q) {
      if (q.entryId === null) return;
      var value = "";
      var el = null;
      if (q.type === 0 || q.type === 4) {
        el = formEl.querySelector("[data-entry='" + q.entryId + "']");
        value = el ? el.value.trim() : "";
      } else if (q.type === 2) {
        el = formEl.querySelector("input[name='q_" + q.entryId + "']:checked");
        value = el ? el.value : "";
      }
      var errEl = formEl.querySelector("[data-err='" + q.entryId + "']");
      if (errEl) errEl.style.display = "none";
      if (el && el.classList) el.classList.remove("invalid");
      if (q.required && !value) { fail(q.entryId, "هذا السؤال مطلوب.", el); return; }
      if (value && q.validation && q.validation.kind === "regex") {
        // Full-string match, exactly like Google's "matches" validation.
        if (!codeMatches(q.validation.pattern, value)) { fail(q.entryId, q.validation.errorText || "إجابة غير صحيحة.", el); return; }
      }
      if (value) answers.push({ entryId: q.entryId, value: value });
    });
    if (firstBad) { firstBad.scrollIntoView({ block: "center" }); return; }
    var params = new URLSearchParams();
    params.set("fvv", "1");
    params.set("pageHistory", "0");
    params.set("fbzx", String(Math.floor(Math.random() * 1e20)));
    answers.forEach(function (a) { params.append("entry." + a.entryId, a.value); });
    var btn = formEl.querySelector("[type='submit']");
    btn.disabled = true;
    btn.textContent = "جارٍ الإرسال…";
    // Plain form POST straight to Google (no-cors: the response is opaque,
    // the app cannot read it back — it only knows the request went out).
    fetch(examForm.submitUrl, {
      method: "POST", mode: "no-cors", body: params,
    }).then(function () {
      view.innerHTML = "<div class='success'><div class='checkCircle'>✓</div>" +
        "<h2>تم إرسال إجابتك</h2>" +
        "<div class='confirm'>" + esc(examForm.confirmationMessage || "تم استلام إجابتك.") + "</div>" +
        "<button class='examBtn' type='button' id='examDone'>رجوع للدرس</button></div>";
      document.getElementById("examDone").addEventListener("click", function () { showLesson(examLesson); });
      window.scrollTo(0, 0);
    }).catch(function () {
      // Network failure only: the form and everything typed stay in place.
      btn.disabled = false;
      btn.textContent = "إرسال الإجابات";
      var err = document.createElement("div");
      err.id = "error";
      err.textContent = "تعذّر الإرسال — اتأكد من النت وحاول تاني.";
      formEl.insertBefore(err, formEl.firstChild);
      window.scrollTo(0, 0);
    });
  }

  showHome();
})();
</script>
</body>
</html>
